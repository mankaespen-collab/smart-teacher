    --navy: #14213D;
    --orange: #E07A2F;
    --rust: #B5541A;
    --blue: #2F6FB3;
    --blue-soft: #DCE6F2;
    --green: #23845A;
    --green-soft: #DCEFE4;

  h3 { font-size: 18px; margin: 0 0 8px; font-weight: 800; }
  p { margin: 0 0 8px; }
  button, input, select, textarea { font: inherit; color: inherit; }

  .top-in { max-width: 1180px; margin: 0 auto; padding: 14px 20px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .brand { display: flex; align-items: center; gap: 12px; margin-right: auto; }
  .logo { width: 42px; height: 42px; border-radius: 12px; background: var(--orange); display: grid; place-items: center; }
  .brand-name { font-size: 22px; font-weight: 900; line-height: 1.1; }
  .brand-sub { font-family: 'PT Sans', Arial, sans-serif; font-size: 14px; color: #BFC8DA; }
  .seg { display: inline-flex; background: rgba(255,255,255,.1); border-radius: 999px; padding: 3px; }
  .seg button { border: 0; background: transparent; color: #DCE3EF; padding: 7px 14px; border-radius: 999px; cursor: pointer; font-family: 'Nunito', Verdana, sans-serif; font-weight: 800; font-size: 14px; }
  .seg button.on { background: #F4F2EC; color: var(--navy); }
  .who { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #DCE3EF; }
  .who select { background: #F4F2EC; color: var(--navy); border: 0; border-radius: 8px; padding: 6px 8px; }

  .tabs-wrap { background: var(--card); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  .tabs { max-width: 1180px; margin: 0 auto; padding: 0 12px; display: flex; gap: 2px; overflow-x: auto; }
  .tab { border: 0; background: transparent; padding: 14px 14px 12px; font-weight: 800; font-size: 15px; color: var(--ink-2); cursor: pointer; border-bottom: 3px solid transparent; white-space: nowrap; }
  .tab.on { color: var(--navy); border-bottom-color: var(--orange); }

  main { max-width: 1180px; margin: 0 auto; padding: 24px 20px 40px; }
  .head-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
  .sub { color: var(--muted); }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }

  .two { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; }

  .btn { border: 0; border-radius: 10px; padding: 9px 16px; font-weight: 800; font-size: 14px; cursor: pointer; background: var(--navy); color: #F4F2EC; }
  .btn:hover { filter: brightness(1.1); }
  .btn.ghost { background: transparent; color: var(--navy); border: 1.5px solid var(--line); }
  .btn.orange { background: var(--orange); color: var(--navy); }
  .btn.danger { background: var(--red); color: #fff; }
  .btn.sm { padding: 6px 11px; font-size: 13px; }
  .btn:focus-visible, .tab:focus-visible, .seg button:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  .chip { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--blue-soft); color: var(--navy); }
  .chip.o { background: var(--amber-soft); color: #7A3A10; }
  .chip.g { background: var(--green-soft); color: #145238; }

  .err { color: var(--red); font-weight: 700; font-size: 14px; margin-top: 8px; }

  ul.clean { margin: 0; padding-left: 20px; }

  .step input { margin-top: 4px; width: 18px; height: 18px; flex-shrink: 0; accent-color: var(--green); }
  .step.done { background: var(--green-soft); border-color: #B6DCC6; }

  .q-t { font-weight: 700; margin-bottom: 8px; }

  footer { max-width: 1180px; margin: 0 auto; padding: 0 20px 32px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; color: var(--muted); font-size: 14px; }
  .empty { text-align: center; color: var(--muted); padding: 36px 16px; }

/* ===================== LOGIC (pure functions, tested on the «Тексеру» tab) ===================== */
function round1(x) { return Math.round(x * 10) / 10; }
function pctToGrade(p) {
  if (p >= 85) return 5;
  if (p >= 65) return 4;
  if (p >= 40) return 3;
  return 2;
}
// Returns a number in [0, max] or null when empty / invalid.
function parseScore(raw, max) {
  if (raw === null || raw === undefined) return null;
  const s = String(raw).trim().replace(',', '.');
  if (s === '') return null;
  const v = Number(s);
  if (!Number.isFinite(v) || v < 0 || v > max) return null;
  return v;
}
// Term percent: (FO + SOR) weigh 50%, SOCh weighs 50%. fo = average of formative marks on a 10-point scale.
function termPct(s, cfg) {
  const vals = [s.fo, s.b1, s.b2, s.t];
  if (vals.some(v => v === null || v === undefined || Number.isNaN(v))) return null;
  const n = cfg.foCount;
  const sumA = s.fo * n + s.b1 + s.b2;
  const maxA = 10 * n + cfg.max1 + cfg.max2;
  return round1(sumA / maxA * 50 + s.t / cfg.maxT * 50);
}
function classStats(grades) {
  const n = grades.length;
  if (!n) return { n: 0, pass: 0, qual: 0, dist: { 5: 0, 4: 0, 3: 0, 2: 0 } };
  const dist = { 5: 0, 4: 0, 3: 0, 2: 0 };
  grades.forEach(g => dist[g]++);
  return {
    n,
    pass: round1((n - dist[2]) / n * 100),
    qual: round1((dist[5] + dist[4]) / n * 100),
    dist
  };
}
function scoreAnswers(quiz, answers) {
  const n = quiz.length;
  let c = 0;
  quiz.forEach((q, i) => { if (answers[i] === q.a) c++; });
  return { correct: c, total: n, pct: n ? round1(c / n * 100) : 0 };
}

const DEFAULT_CFG = { foCount: 7, max1: 20, max2: 20, maxT: 25 };

function seeded(seed) { let s = seed >>> 0; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function buildDemo() {
  const students = DEMO_STUDENTS.map(([id, name]) => ({ id, name }));
  const scores = {};
  DEMO_STUDENTS.forEach(([id, , fo, b1, b2, t]) => { scores[id] = { fo: String(fo), b1: String(b1), b2: String(b2), t: String(t) }; });
  const lessons = JSON.parse(JSON.stringify(DEMO_LESSONS));
  const attempts = {};
  const rnd = seeded(2026);
  DEMO_STUDENTS.forEach(([id, , fo, b1, b2, t]) => {
    const ability = termPct({ fo, b1, b2, t }, DEFAULT_CFG) / 100;
    lessons.forEach((l, li) => {
      if (li === 2 && rnd() < 0.35) return; // some students have not taken the newest quiz yet
      attempts[id + '|' + l.id] = l.quiz.map((q, qi) => {
        const hard = (li === 0 && qi === 3) || (li === 1 && qi === 2) ? 0.25 : 0;
        return rnd() < ability - hard + 0.08 ? q.a : (q.a + 1 + Math.floor(rnd() * 3)) % 4;
      });
    });
  });
  return { students, scores, lessons, attempts, cfg: { ...DEFAULT_CFG }, steps: {} };
}

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

function parsedScores(id) {

const GRADE_COLORS = { 5: '#23845A', 4: '#2F6FB3', 3: '#E07A2F', 2: '#B83A2E' };
function gradeSummary() {
  const terms = data.students.map(s => studentTerm(s.id)).filter(Boolean);
  const st = classStats(terms.map(x => x.g));
  const avg = terms.length ? round1(terms.reduce((a, x) => a + x.p, 0) / terms.length) : null;
  const comps = ['fo', 'b1', 'b2', 't'].map(k => {
    const max = k === 'fo' ? 10 : data.cfg[{ b1: 'max1', b2: 'max2', t: 'maxT' }[k]];
    const vals = data.students.map(s => parsedScores(s.id)[k]).filter(v => v !== null);
    return { k, v: vals.length ? round1(vals.reduce((a, b) => a + b, 0) / vals.length / max * 100) : null };
  });
  return { st, avg, comps };
}
function updateGradeCalcs() {
  data.students.forEach(s => {
    const r = studentTerm(s.id);
    const pc = document.getElementById('pct-' + s.id), gr = document.getElementById('gr-' + s.id);
    if (pc) pc.textContent = r ? fmt(r.p) + '%' : '—';
    if (gr) gr.innerHTML = r ? badge(r.g) : '—';
  });
  document.querySelectorAll('.score-in').forEach(inp => {
    const max = Number(inp.dataset.max); const raw = inp.value;
    const bad = raw.trim() !== '' && parseScore(raw, max) === null;
    inp.classList.toggle('invalid', bad);
    inp.title = bad ? t('invalid', { m: max }) : '';
    inp.setAttribute('aria-invalid', bad ? 'true' : 'false');
  });
  const { st, avg, comps } = gradeSummary();
  const k = document.getElementById('kpis');
  if (k) k.innerHTML = [
    [t('statAvg'), avg === null ? '—' : fmt(avg) + '%'], [t('statPass'), fmt(st.pass) + '%'], [t('statQual'), fmt(st.qual) + '%'], [t('statN'), st.n + ' / ' + data.students.length]
  ].map(([l, v]) => `<div class="kpi"><div class="kpi-l">${l}</div><div class="kpi-v">${v}</div></div>`).join('');
  const d = document.getElementById('dist');
  if (d) d.innerHTML = [5, 4, 3, 2].map(g => {
    const n = st.dist[g]; const w = st.n ? n / st.n * 100 : 0;
    return `<div class="bar-row"><span>${t('gradeWord')[g].split(' — ')[0]} <span class="sub">${t('gradeWord')[g].split(' — ')[1]}</span></span><div class="bar-track"><div class="bar-fill" style="width:${w}%; background:${GRADE_COLORS[g]};"></div></div><span class="bar-v">${n}</span></div>`;
  }).join('');
  const cp = document.getElementById('comp');
  if (cp) cp.innerHTML = comps.map(x => `<div class="bar-row"><span>${esc(cap(t('comp')[x.k]))}</span><div class="bar-track"><div class="bar-fill" style="width:${x.v || 0}%; background:#2F6FB3;"></div></div><span class="bar-v">${x.v === null ? '—' : fmt(x.v) + '%'}</span></div>`).join('');
}
function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
function reportText() {
  const { st, avg, comps } = gradeSummary();
  const lines = [t('reportHead'), '',
    `${t('statAvg')}: ${avg === null ? '—' : fmt(avg) + '%'}`, `${t('statPass')}: ${fmt(st.pass)}%`, `${t('statQual')}: ${fmt(st.qual)}%`, `${t('statN')}: ${st.n} / ${data.students.length}`, '',
    t('statDist') + ':', ...[5, 4, 3, 2].map(g => `  ${t('gradeWord')[g]}: ${st.dist[g]}`), '',
    t('statComp') + ':', ...comps.map(x => `  ${cap(t('comp')[x.k])}: ${x.v === null ? '—' : fmt(x.v) + '%'}`), '',
    `${t('colStudent')} — ${t('colPct')} — ${t('colGrade')}`,
    ...data.students.map(s => { const r = studentTerm(s.id); return `  ${s.name} — ${r ? fmt(r.p) + '%' : '—'} — ${r ? r.g : '—'}`; })];
  return lines.join('\n');
}

/* ===================== VIEW: results ===================== */
function quizStats(l) {
  const taken = data.students.filter(s => attemptOf(s.id, l.id));
  const pcts = taken.map(s => quizPct(s.id, l.id));
  const avg = pcts.length ? round1(pcts.reduce((a, b) => a + b, 0) / pcts.length) : null;
  const perQ = l.quiz.map((q, i) => { const ok = taken.filter(s => attemptOf(s.id, l.id)[i] === q.a).length; return taken.length ? round1(ok / taken.length * 100) : null; });
  let hardest = -1; perQ.forEach((v, i) => { if (v !== null && (hardest < 0 || v < perQ[hardest])) hardest = i; });
  return { n: taken.length, avg, perQ, hardest };
}
function viewResults() {
  const l = lessonById(ui.resLesson) || data.lessons[0];
  if (!l) return `<p class="empty">—</p>`;
  ui.resLesson = l.id;
  const chips = data.lessons.map(x => `<button class="btn ${x.id === l.id ? '' : 'ghost'} sm" data-act="resLesson" data-v="${x.id}">${esc(L(x.title))}</button>`).join('');
  const s = quizStats(l);
  const bars = l.quiz.map((q, i) => `<div class="bar-row" title="${esc(L(q.q))}"><span>${t('qShort', { n: i + 1 })}</span><div class="bar-track"><div class="bar-fill" style="width:${s.perQ[i] || 0}%; background:${i === s.hardest ? '#E07A2F' : '#2F6FB3'};"></div></div><span class="bar-v">${s.perQ[i] === null ? '—' : fmt(s.perQ[i]) + '%'}</span></div>`).join('');
  const rows = data.students.map(st => {
    const p = quizPct(st.id, l.id); const term = studentTerm(st.id);
    return `<tr><td>${esc(st.name)}</td><td class="num">${p === null ? t('notTaken') : fmt(p) + '%'}</td><td class="num">${p === null ? '—' : badge(pctToGrade(p))}</td><td class="num">${data.lessons.map(x => { const v = quizPct(st.id, x.id); return v === null ? '·' : fmt(v); }).join(' / ')}</td><td class="num">${term ? badge(term.g) : '—'}</td></tr>`;
  }).join('');
  return `<div class="head-row"><div><h2>${t('resultsTitle')}</h2><p class="sub">${t('resultsSub')}</p></div></div>
    <div class="row" style="margin-bottom:16px;">${chips}</div>
    <div class="kpis" style="margin-bottom:16px;">
      <div class="kpi"><div class="kpi-l">${t('avgQuiz')}</div><div class="kpi-v">${s.avg === null ? '—' : fmt(s.avg) + '%'}</div></div>
      <div class="kpi"><div class="kpi-l">${t('attempts')}</div><div class="kpi-v">${s.n} / ${data.students.length}</div></div>
      <div class="kpi" style="grid-column: span 2;"><div class="kpi-l">${t('hardest')}</div><div style="font-weight:700; margin-top:6px;">${s.hardest >= 0 ? `${s.hardest + 1}. ${esc(L(l.quiz[s.hardest].q))} — <span style="color:var(--rust);">${fmt(s.perQ[s.hardest])}%</span>` : '—'}</div></div>
    </div>
    <div class="two">
      <div class="card"><h3>${t('perQ')}</h3><div class="bars">${bars || `<p class="sub">${t('noQuiz')}</p>`}</div></div>
      <div class="table-wrap"><table><thead><tr><th>${t('colStudent')}</th><th class="num">%</th><th class="num">${t('colGrade')}</th><th class="num">${data.lessons.map((x, i) => i + 1).join(' / ')}</th><th class="num">${t('colPct').split(',')[0]}</th></tr></thead><tbody>${rows}</tbody></table></div>
    </div>`;
}

/* ===================== VIEW: feedback ===================== */
function feedbackText(sid) {
  const ps = parsedScores(sid); const term = studentTerm(sid);
  if (!term) return null;
  const c = data.cfg;
  const parts = { fo: ps.fo / 10 * 100, b1: ps.b1 / c.max1 * 100, b2: ps.b2 / c.max2 * 100, t: ps.t / c.maxT * 100 };
  const keys = Object.keys(parts);
  const best = keys.reduce((a, b) => parts[b] > parts[a] ? b : a);
  const weak = keys.reduce((a, b) => parts[b] < parts[a] ? b : a);
  const first = studentName(sid).split(' ')[0];
  const quizVals = data.lessons.map(l => quizPct(sid, l.id)).filter(v => v !== null);
  const qAvg = quizVals.length ? round1(quizVals.reduce((a, b) => a + b, 0) / quizVals.length) : null;
  const lines = [
    t('fbIntro', { name: first, p: fmt(term.p), g: term.g }),
    t('fbBest', { c: t('comp')[best], v: fmt(round1(parts[best])) })
  ];
  if (weak !== best) lines.push(t('fbWeak', { c: t('comp')[weak], v: fmt(round1(parts[weak])) }));
  if (qAvg !== null) lines.push(t('fbQuiz', { q: fmt(qAvg) }));
  lines.push(t('fbAdvice')[term.g].split('{c}').join(t('comp')[weak]));
  lines.push('', t('fbSign'));
  return lines.join('\n');
}
function viewFeedback() {
  const opts = data.students.map(s => { const r = studentTerm(s.id); return `<option value="${s.id}" ${s.id === ui.fbStudent ? 'selected' : ''}>${esc(s.name)}${r ? ' — ' + r.g : ''}</option>`; }).join('');
  const txt = feedbackText(ui.fbStudent);
  return `<div class="head-row"><div><h2>${t('fbTitle')}</h2><p class="sub">${t('fbSub')}</p></div></div>
    <div class="card" style="max-width:820px;">
      <label class="f" for="fbSel" style="margin-top:0;">${t('fbChoose')}</label>
      <select class="in" id="fbSel" data-act="fbStudent">${opts}</select>
      <div class="fb-box" style="margin-top:14px;" id="fbBox">${txt === null ? `<span class="sub">${t('fbNoData')}</span>` : esc(txt)}</div>
      <div class="row" style="margin-top:12px;"><button class="btn orange" data-act="copyFb" ${txt === null ? 'disabled' : ''}>📋 ${t('copy')}</button></div>
    </div>`;
}

/* ===================== VIEW: self-check ===================== */
function selfTests() {
  const sampleQuiz = [{ a: 0 }, { a: 2 }, { a: 1 }, { a: 3 }];
  return [
    ['pctToGrade(0) → 2', () => pctToGrade(0) === 2],
    ['pctToGrade(39.9) → 2', () => pctToGrade(39.9) === 2],
    ['pctToGrade(40) → 3', () => pctToGrade(40) === 3],
    ['pctToGrade(64.9) → 3', () => pctToGrade(64.9) === 3],
    ['pctToGrade(65) → 4', () => pctToGrade(65) === 4],
    ['pctToGrade(84.9) → 4', () => pctToGrade(84.9) === 4],
    ['pctToGrade(85) → 5', () => pctToGrade(85) === 5],
    ['pctToGrade(100) → 5', () => pctToGrade(100) === 5],
    ['termPct: informburo.kz мысалы / пример → 85%', () => termPct({ fo: 59 / 7, b1: 15, b2: 14, t: 18 }, { foCount: 7, max1: 20, max2: 20, maxT: 20 }) === 85],
    ['termPct: max → 100%', () => termPct({ fo: 10, b1: 20, b2: 20, t: 25 }, DEFAULT_CFG) === 100],
    ['termPct: 0 → 0%', () => termPct({ fo: 0, b1: 0, b2: 0, t: 0 }, DEFAULT_CFG) === 0],
    ['termPct: бос / пусто → null', () => termPct({ fo: 8, b1: null, b2: 10, t: 10 }, DEFAULT_CFG) === null],
    ["parseScore('21', 20) → null", () => parseScore('21', 20) === null],
    ["parseScore('-1', 20) → null", () => parseScore('-1', 20) === null],
    ["parseScore('abc', 20) → null", () => parseScore('abc', 20) === null],
    ["parseScore('7,5', 10) → 7.5", () => parseScore('7,5', 10) === 7.5],
    ['scoreAnswers: 4/4 → 100%', () => scoreAnswers(sampleQuiz, [0, 2, 1, 3]).pct === 100],
    ['scoreAnswers: 1/4 → 25%', () => scoreAnswers(sampleQuiz, [0, 0, 0, 0]).pct === 25],
    ['scoreAnswers: [] → 0%', () => scoreAnswers(sampleQuiz, []).pct === 0],
    ['classStats([5,4,3,2]) → 75% / 50%', () => { const s = classStats([5, 4, 3, 2]); return s.pass === 75 && s.qual === 50; }],
    ['classStats([]) → 0', () => classStats([]).n === 0]
  ];
}
function viewCheck() {
  const res = selfTests().map(([name, fn]) => { let ok = false; try { ok = fn() === true; } catch (e) { ok = false; } return { name, ok }; });
  const p = res.filter(r => r.ok).length;
  return `<div class="head-row"><div><h2>${t('checkTitle')}</h2><p class="sub">${t('checkSub')}</p></div>
      <button class="btn ghost" data-act="rerun">↻ ${t('runAgain')}</button></div>
    <div class="kpis" style="margin-bottom:16px;"><div class="kpi"><div class="kpi-l">✓</div><div class="kpi-v" style="color:${p === res.length ? 'var(--green)' : 'var(--red)'};">${t('passed', { p, n: res.length })}</div></div></div>
    <div class="card" style="padding:4px 6px;">${res.map(r => `<div class="test-row"><span class="${r.ok ? 'pass' : 'fail'}">${r.ok ? '✓ PASS' : '✗ FAIL'}</span><code>${esc(r.name)}</code></div>`).join('')}</div>`;
}

/* ===================== VIEW: student results ===================== */
function viewMy() {
  const rows = data.lessons.map(l => ({ l, p: quizPct(ui.me, l.id) })).filter(x => x.p !== null);
  if (!rows.length) return `<div class="head-row"><div><h2>${t('myTitle')}</h2></div></div><div class="card empty">${t('myEmpty')}</div>`;
  const avg = round1(rows.reduce((a, x) => a + x.p, 0) / rows.length);
  return `<div class="head-row"><div><h2>${t('myTitle')}</h2><p class="sub">${esc(studentName(ui.me))}</p></div></div>
    <div class="kpis" style="margin-bottom:16px;"><div class="kpi"><div class="kpi-l">${t('myAvg')}</div><div class="kpi-v">${fmt(avg)}%</div></div>
      <div class="kpi"><div class="kpi-l">${t('gradeLbl')}</div><div class="kpi-v">${badge(pctToGrade(avg))}</div></div></div>
    <div class="card"><div class="bars">${rows.map(x => `<div class="bar-row" style="grid-template-columns: minmax(140px, 1.2fr) 2fr 70px;"><span>${esc(L(x.l.title))}</span><div class="bar-track"><div class="bar-fill" style="width:${x.p}%; background:${GRADE_COLORS[pctToGrade(x.p)]};"></div></div><span class="bar-v">${fmt(x.p)}%</span></div>`).join('')}</div></div>`;
}

/* ===================== EVENTS ===================== */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.tagName === 'SELECT' || (el.tagName === 'INPUT' && el.type !== 'checkbox' && el.type !== 'radio')) return;
  const a = el.dataset.act, v = el.dataset.v;
  if (a !== 'reset') ui.resetArm = false;
  if (a !== 'delLesson') ui.delArm = null;
  switch (a) {
    case 'lang': ui.lang = v; persist(); render(); break;
    case 'role': ui.role = v; ui.tab = 'lessons'; ui.openLesson = null; ui.run = null; ui.editing = null; persist(); render(); break;
    case 'tab': ui.tab = v; ui.openLesson = null; ui.run = null; ui.editing = null; ui.formErr = ''; render(); window.scrollTo(0, 0); break;
    case 'openLesson': ui.openLesson = v; render(); window.scrollTo(0, 0); break;
    case 'closeLesson': ui.openLesson = null; render(); break;
    case 'newLesson': ui.formErr = ''; ui.editing = { id: null, draft: { title: '', subject: 'physics', grade: 8, duration: 40, goal: '', materials: '', safety: '', steps: '' } }; render(); break;
    case 'editLesson': {
      const l = lessonById(v); ui.formErr = '';
      ui.editing = { id: v, draft: { title: L(l.title), subject: l.subject, grade: l.grade, duration: l.duration, goal: L(l.goal), materials: (L(l.materials) || []).join('\n'), safety: L(l.safety), steps: (L(l.steps) || []).join('\n') } };
      render(); window.scrollTo(0, 0); break;
    }
    case 'cancelEdit': ui.editing = null; ui.formErr = ''; render(); break;
    case 'delLesson':
      if (ui.delArm === v) {
        data.lessons = data.lessons.filter(l => l.id !== v);
        Object.keys(data.attempts).forEach(k => { if (k.endsWith('|' + v)) delete data.attempts[k]; });
        ui.delArm = null; persist(); toast(t('deleted'));
      } else ui.delArm = v;
      render(); break;
    case 'startQuiz': ui.run = { lid: v, answers: [], done: false, err: false }; render(); window.scrollTo(0, 0); break;
    case 'closeRun': ui.run = null; render(); break;
    case 'retry': ui.run = { lid: ui.run.lid, answers: [], done: false, err: false }; render(); window.scrollTo(0, 0); break;
    case 'submitQuiz': {
      const l = lessonById(ui.run.lid);
      const answered = l.quiz.every((q, i) => Number.isInteger(ui.run.answers[i]));
      if (!answered) { ui.run.err = true; render(); break; }
      ui.run.done = true; ui.run.err = false;
      if (ui.role === 'student') { data.attempts[ui.me + '|' + l.id] = ui.run.answers.slice(); persist(); }
      render(); window.scrollTo(0, 0); break;
    }
    case 'ans': ui.run.answers[Number(el.dataset.q)] = Number(v); break;
    case 'step': {
      const key = ui.me + '|' + ui.openLesson; const set = new Set(data.steps[key] || []); const i = Number(v);
      if (el.checked) set.add(i); else set.delete(i);
      data.steps[key] = [...set]; persist(); render(); break;
    }
    case 'delQ': { const l = lessonById(ui.quizLesson); l.quiz.splice(Number(v), 1); persist(); toast(t('qDeleted')); render(); break; }
    case 'resLesson': ui.resLesson = v; render(); break;
    case 'copyReport': copyText(reportText()); break;
    case 'copyFb': { const txt = feedbackText(ui.fbStudent); if (txt) copyText(txt); break; }
    case 'rerun': render(); toast('✓'); break;
    case 'reset':
      if (ui.resetArm) { data = buildDemo(); ui.resetArm = false; ui.openLesson = null; ui.run = null; ui.editing = null; persist(); toast(t('resetDone')); }
      else ui.resetArm = true;
      render(); break;
  }
});
document.addEventListener('change', e => {
  const el = e.target; const a = el.dataset && el.dataset.act;
  if (a === 'me') { ui.me = el.value; ui.run = null; render(); }
  if (a === 'quizLesson') { ui.quizLesson = el.value; ui.formErr = ''; render(); }
  if (a === 'fbStudent') { ui.fbStudent = el.value; render(); }
});
document.addEventListener('input', e => {
  const el = e.target; const a = el.dataset && el.dataset.act;
  if (a === 'score') { data.scores[el.dataset.sid] = data.scores[el.dataset.sid] || {}; data.scores[el.dataset.sid][el.dataset.k] = el.value; persist(); updateGradeCalcs(); }
  if (a === 'cfg') {
    const n = Math.round(Number(el.value));
    const lim = el.dataset.k === 'foCount' ? [1, 30] : [1, 100];
    if (Number.isFinite(n) && n >= lim[0] && n <= lim[1]) {
      data.cfg[el.dataset.k] = n; persist();
      const k = el.dataset.k;
      if (k !== 'foCount') {
        const map = { max1: 'b1', max2: 'b2', maxT: 't' };
        document.querySelectorAll(`.score-in[data-k="${map[k]}"]`).forEach(i => i.dataset.max = n);
        const th = document.querySelectorAll('thead th'); const idx = { max1: 2, max2: 3, maxT: 4 }[k];
        if (th[idx]) th[idx].textContent = `${t({ max1: 'colB1', max2: 'colB2', maxT: 'colT' }[k])} / ${n}`;
      }
      updateGradeCalcs();
    }
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'lessonForm') {
    const g = id => document.getElementById(id).value;
    const lines = s => s.split('\n').map(x => x.trim()).filter(Boolean);
    const draft = { title: g('fTitle').trim(), subject: g('fSubject'), grade: Math.min(11, Math.max(1, Math.round(Number(g('fGrade')) || 8))), duration: Math.min(180, Math.max(10, Math.round(Number(g('fDuration')) || 40))), goal: g('fGoal').trim(), materials: g('fMaterials'), safety: g('fSafety').trim(), steps: g('fSteps') };
    if (!draft.title || !lines(draft.steps).length) { ui.editing.draft = draft; ui.formErr = t('errTitle'); render(); return; }
    const obj = { subject: draft.subject, grade: draft.grade, duration: draft.duration, title: draft.title, goal: draft.goal, materials: lines(draft.materials), safety: draft.safety, steps: lines(draft.steps) };
    if (ui.editing.id) { const l = lessonById(ui.editing.id); Object.assign(l, obj); ui.openLesson = l.id; }
    else { const l = { id: uid('l'), quiz: [], ...obj }; data.lessons.push(l); ui.openLesson = l.id; }
    ui.editing = null; ui.formErr = ''; persist(); toast(t('saved')); render(); window.scrollTo(0, 0);
  }
  if (e.target.id === 'qForm') {
    const q = document.getElementById('qText').value.trim();
    const opts = [0, 1, 2, 3].map(j => document.getElementById('qOpt' + j).value.trim());
    const c = document.querySelector('input[name="qCorrect"]:checked');
    if (!q || opts.some(o => !o) || !c) { ui.formErr = 'q'; render();
      document.getElementById('qText').value = q; opts.forEach((o, j) => document.getElementById('qOpt' + j).value = o);
      if (c) document.querySelector(`input[name="qCorrect"][value="${c.value}"]`).checked = true; return; }
    lessonById(ui.quizLesson).quiz.push({ q, opts, a: Number(c.value) });
    ui.formErr = ''; persist(); toast(t('qAdded')); render();
  }
});

render();
</script>
